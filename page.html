
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Under Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: appear 0.8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.game-icon {
    font-size: 75px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

h1 {
    color: #333;
    font-size: 27px;
    margin-bottom: 15px;
}

h1 span {
    color: #ff6584;
}

p {
    color: #777;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.status {
    display: inline-block;
    background: #fff0d9;
    color: #f39c12;
    padding: 9px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 20px;
}

button {
    border: none;
    outline: none;
    padding: 14px 28px;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff6584, #ff8e53);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(255,101,132,0.3);
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 20px rgba(255,101,132,0.4);
}

.footer {
    margin-top: 25px;
    color: #aaa;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="game-icon">🎮</div>

    <div class="status">⚙️ Under Maintenance</div>

    <h1>Oops! <span>Game Unavailable</span></h1>

    <p>
        This game is currently under maintenance.
        Our team is working hard to make it better.
        Meanwhile, you can try another exciting game!
    </p>

    <button onclick="tryAnotherGame()">
        🎯 Try Another Game
    </button>

    <div class="footer">
        Thank you for your patience ❤️
    </div>

</div>

<script>
function tryAnotherGame() {
    // Change this URL to your other game page
    window.location.href = "games.html";
}
</script>

</body>
</html>
