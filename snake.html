
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #171738, #35245e);
    font-family: Arial, sans-serif;
    color: white;
}

.game-container {
    width: 90%;
    max-width: 480px;
    padding: 25px;
    background: #25254b;
    border: 2px solid #56568d;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px #0005;
}

h1 {
    font-size: 32px;
    color: #52ffb8;
    margin-bottom: 8px;
}

.subtitle {
    color: #bbb;
    margin-bottom: 20px;
}

.score-board {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    gap: 10px;
}

.score-box {
    flex: 1;
    padding: 12px;
    background: #383866;
    border-radius: 12px;
}

.score-box span {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 5px;
}

.score-box strong {
    font-size: 22px;
    color: #52ffb8;
}

canvas {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1;
    background: #17172e;
    border: 3px solid #52ffb8;
    border-radius: 12px;
    display: block;
    margin: auto;
}

.message {
    margin: 15px 0;
    color: #ffd166;
    min-height: 20px;
}

button {
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    background: linear-gradient(135deg, #52ffb8, #00c9ff);
    color: #171738;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.06);
}

.controls {
    margin-top: 18px;
    color: #aaa;
    font-size: 13px;
}

.mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 55px);
    justify-content: center;
    gap: 7px;
    margin-top: 15px;
}

.mobile-controls button {
    padding: 12px;
    font-size: 18px;
    border-radius: 12px;
}

.mobile-controls button:nth-child(1) {
    grid-column: 2;
}

.mobile-controls button:nth-child(2) {
    grid-column: 1;
}

.mobile-controls button:nth-child(3) {
    grid-column: 2;
}

.mobile-controls button:nth-child(4) {
    grid-column: 3;
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Eat, grow and beat your high score!</p>

    <div class="score-board">
        <div class="score-box">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="score-box">
            <span>BEST SCORE</span>
            <strong id="best">0</strong>
        </div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <p class="message" id="message">Press Start to play!</p>

    <button id="startBtn">▶ Start Game</button>

    <div class="mobile-controls">
        <button onclick="changeDirection('UP')">⬆️</button>
        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <p class="controls">
        Use Arrow Keys or WASD to move
    </p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
const total = canvas.width / box;

let snake, food, direction, nextDirection;
let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;
let gameLoop = null;
let running = false;
let gameOver = false;

document.getElementById("best").textContent = best;

function initGame() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";
    score = 0;
    running = true;
    gameOver = false;

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent = "Good luck! 🐍";
    document.getElementById("startBtn").textContent = "↻ Restart";

    createFood();
    draw();

    clearInterval(gameLoop);
    gameLoop = setInterval(update, 120);
}

function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * total),
            y: Math.floor(Math.random() * total)
        };
    } while (snake.some(part => part.x === food.x && part.y === food.y));
}

function draw() {
    ctx.fillStyle = "#17172e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "#252545";
    ctx.lineWidth = 1;

    for (let i = 0; i <= canvas.width; i += box) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff5c8a";
    ctx.shadowColor = "#ff5c8a";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.arc(
        food.x * box + box / 2,
        food.y * box + box / 2,
        8, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    // Snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#52ffb8" : "#19c995";

        ctx.beginPath();
        ctx.roundRect(
            part.x * box + 2,
            part.y * box + 2,
            box - 4,
            box - 4,
            6
        );
        ctx.fill();

        if (index === 0) {
            ctx.fillStyle = "#171738";

            let eyes = [];

            if (direction === "RIGHT") eyes = [[13, 6], [13, 13]];
            if (direction === "LEFT") eyes = [[5, 6], [5, 13]];
            if (direction === "UP") eyes = [[6, 5], [13, 5]];
            if (direction === "DOWN") eyes = [[6, 13], [13, 13]];

            eyes.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(part.x * box + x, part.y * box + y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    });
}

function update() {
    direction = nextDirection;

    const head = {...snake[0]};

    if (direction === "RIGHT") head.x++;
    if (direction === "LEFT") head.x--;
    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;

    // Wall collision
    if (
        head.x < 0 || head.x >= total ||
        head.y < 0 || head.y >= total
    ) {
        endGame();
        return;
    }

    const ateFood = head.x === food.x && head.y === food.y;

    // Self collision
    const body = ateFood ? snake : snake.slice(0, -1);

    if (body.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ateFood) {
        score += 10;

        document.getElementById("score").textContent = score;

        if (score > best) {
            best = score;
            localStorage.setItem("snakeBest", best);
            document.getElementById("best").textContent = best;
        }

        createFood();
    } else {
        snake.pop();
    }

    draw();
}

function changeDirection(newDirection) {
    if (!running) return;

    const opposites = {
        UP: "DOWN",
        DOWN: "UP",
        LEFT: "RIGHT",
        RIGHT: "LEFT"
    };

    if (newDirection !== opposites[direction]) {
        nextDirection = newDirection;
    }
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: "UP",
        w: "UP",
        ArrowDown: "DOWN",
        s: "DOWN",
        ArrowLeft: "LEFT",
        a: "LEFT",
        ArrowRight: "RIGHT",
        d: "RIGHT"
    };

    const key = keys[e.key] || keys[e.key.toLowerCase()];

    if (key) {
        e.preventDefault();
        changeDirection(key);
    }
});

function endGame() {
    clearInterval(gameLoop);
    running = false;
    gameOver = true;

    document.getElementById("message").textContent =
        "💥 Game Over! Your score: " + score;

    document.getElementById("startBtn").textContent = "▶ Play Again";
}

document.getElementById("startBtn").addEventListener("click", initGame);

// Initial screen
ctx.fillStyle = "#17172e";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = "#52ffb8";
ctx.font = "bold 25px Arial";
ctx.textAlign = "center";
ctx.fillText("Ready to Play? 🐍", 200, 190);

ctx.fillStyle = "#ffffff";
ctx.font = "15px Arial";
ctx.fillText("Press Start Game", 200, 225);

</script>

</body>
</html>
