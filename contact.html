
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Waibhav Roth</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f8;
}

.contact-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.contact-container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.contact-info {
    background: linear-gradient(135deg, #171c40, #3548a5);
    color: white;
    padding: 50px 35px;
}

.contact-info h1 {
    font-size: 34px;
    margin-bottom: 20px;
}

.contact-info > p {
    line-height: 1.7;
    color: #e0e4ff;
    margin-bottom: 40px;
}

.info-item {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.info-item span {
    font-size: 25px;
}

.info-item h3 {
    margin-bottom: 7px;
}

.info-item p {
    color: #e0e4ff;
    font-size: 14px;
    line-height: 1.5;
}

.info-item a {
    color: white;
    text-decoration: none;
}

.info-item a:hover {
    text-decoration: underline;
}

.contact-form {
    padding: 50px 40px;
}

.contact-form h2 {
    font-size: 28px;
    color: #171c40;
    margin-bottom: 30px;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 15px;
    margin-bottom: 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.contact-form input:focus,
.contact-form textarea:focus {
    border-color: #3548a5;
    box-shadow: 0 0 5px rgba(53,72,165,0.2);
}

.contact-form textarea {
    resize: vertical;
}

.contact-form button {
    width: 100%;
    padding: 16px;
    background: #3548a5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.contact-form button:hover {
    background: #171c40;
    transform: translateY(-2px);
}

#response {
    margin-top: 15px;
    font-size: 14px;
    color: #3548a5;
}

@media (max-width: 768px) {
    .contact-container {
        grid-template-columns: 1fr;
    }

    .contact-info,
    .contact-form {
        padding: 35px 25px;
    }

    .contact-info h1 {
        font-size: 28px;
    }
}

    </style>
</head>
<body>

    <section class="contact-section">
        <div class="contact-container">

            <div class="contact-info">
                <h1>Get In Touch</h1>
                <p>
                    Have a question or want to work together?
                    Feel free to contact me. I'd love to hear from you!
                </p>

                <div class="info-item">
                    <span>👤</span>
                    <div>
                        <h3>Name</h3>
                        <p>Waibhav Roth</p>
                    </div>
                </div>

                <div class="info-item">
                    <span>📧</span>
                    <div>
                        <h3>Email</h3>
                        <p>
                            <a href="mailto:waibhavroth@gmail.com">
                                waibhavroth@gmail.com
                            </a>
                        </p>
                    </div>
                </div>

                <div class="info-item">
                    <span>💬</span>
                    <div>
                        <h3>Let's Talk</h3>
                        <p>I'm always happy to connect with you.</p>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <h2>Contact Me</h2>

                <form id="contactForm">
                    <input
                        type="text"
                        id="name"
                        placeholder="Your Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Your Email"
                        required
                    >

                    <input
                        type="text"
                        id="subject"
                        placeholder="Subject"
                        required
                    >

                    <textarea
                        id="message"
                        placeholder="Write your message..."
                        rows="6"
                        required
                    ></textarea>

                    <button type="submit">Send Message →</button>
                </form>

                <p id="response"></p>
            </div>

        </div>
    </section>

    

    <script>
        
const contactForm = document.getElementById("contactForm");
const response = document.getElementById("response");

contactForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !subject || !message) {
        response.textContent = "Please fill in all fields.";
        return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        response.textContent = "Please enter a valid email address.";
        return;
    }

    const mailSubject = encodeURIComponent(subject);
    const mailBody = encodeURIComponent(
        "Name: " + name +
        "\nEmail: " + email +
        "\n\nMessage:\n" + message
    );

    response.textContent = "Opening your email application...";

    window.location.href =
        "mailto:waibhavroth@gmail.com?subject=" +
        mailSubject + "&body=" + mailBody;
});

    </script>
</body>
</html>
