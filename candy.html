
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Crush Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    padding: 20px;
}

header {
    text-align: center;
    margin: 20px 0;
}

header h1 {
    font-size: 38px;
    color: #fff;
    text-shadow: 3px 3px #ff4f91;
}

header p {
    color: #fff;
    margin-top: 8px;
}

.game-container {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    width: min(100%, 430px);
}

.score-board {
    display: flex;
    justify-content: space-around;
    margin-bottom: 18px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
}

#game-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,255,255,0.4);
    padding: 7px;
    border-radius: 15px;
}

.candy {
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 6vw, 30px);
    background: rgba(255,255,255,0.3);
    transition: transform 0.15s;
    user-select: none;
}

.candy:hover {
    transform: scale(1.1);
}

.candy.selected {
    outline: 3px solid white;
    transform: scale(0.9);
}

button {
    border: none;
    padding: 13px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 5px;
    transition: 0.3s;
}

.play-btn {
    background: #ff3f81;
    color: white;
}

.play-btn:hover {
    background: #e91e63;
    transform: scale(1.05);
}

.replay-btn {
    background: #6c5ce7;
    color: white;
}

.replay-btn:hover {
    background: #4834d4;
    transform: scale(1.05);
}

#message {
    margin-top: 12px;
    min-height: 24px;
    font-weight: bold;
    color: white;
}

footer {
    margin-top: auto;
    padding: 25px 10px 5px;
    text-align: center;
    color: white;
    font-weight: bold;
}

footer span {
    color: #ff2776;
    text-shadow: 1px 1px white;
}

@media(max-width: 400px) {
    .game-container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍭 Candy Crush 🍬</h1>
    <p>Match candies and score big!</p>
</header>

<div class="game-container">

    <div class="score-board">
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🎯 Moves: <span id="moves">30</span></div>
    </div>

    <div id="game-board"></div>

    <div id="message">Press Play Game to start!</div>

    <button class="play-btn" onclick="startGame()">
        ▶ Play Game
    </button>

</div>

<footer>
    <p>Made with ❤️ | Website Build by
        <span>Waibhav Roth</span>
    </p>
    <button class="replay-btn" onclick="startGame()">
        🔄 Replay Game
    </button>
</footer>

<script>
const board = document.getElementById("game-board");
const scoreDisplay = document.getElementById("score");
const movesDisplay = document.getElementById("moves");
const message = document.getElementById("message");

const width = 8;
const candies = ["🍭", "🍬", "🍫", "🍒", "🍓", "🍇"];

let squares = [];
let score = 0;
let moves = 30;
let selected = null;
let playing = false;
let busy = false;

function randomCandy() {
    return candies[Math.floor(Math.random() * candies.length)];
}

function createBoard() {
    board.innerHTML = "";
    squares = [];

    for (let i = 0; i < width * width; i++) {
        const candy = document.createElement("div");
        candy.classList.add("candy");
        candy.textContent = randomCandy();
        candy.dataset.id = i;

        candy.addEventListener("click", () => selectCandy(i));

        board.appendChild(candy);
        squares.push(candy);
    }

    clearMatches(false);
}

function startGame() {
    score = 0;
    moves = 30;
    selected = null;
    playing = true;
    busy = false;

    scoreDisplay.textContent = score;
    movesDisplay.textContent = moves;
    message.textContent = "Match 3 or more candies! 🍬";

    createBoard();
}

function selectCandy(index) {
    if (!playing || busy) return;

    if (selected === null) {
        selected = index;
        squares[index].classList.add("selected");
        return;
    }

    if (selected === index) {
        squares[index].classList.remove("selected");
        selected = null;
        return;
    }

    const first = selected;
    squares[first].classList.remove("selected");
    selected = null;

    if (!isAdjacent(first, index)) {
        selected = index;
        squares[index].classList.add("selected");
        return;
    }

    swapCandies(first, index);
}

function isAdjacent(a, b) {
    const rowA = Math.floor(a / width);
    const rowB = Math.floor(b / width);

    return (
        Math.abs(a - b) === width ||
        (rowA === rowB && Math.abs(a - b) === 1)
    );
}

function swapCandies(a, b) {
    busy = true;

    const temp = squares[a].textContent;
    squares[a].textContent = squares[b].textContent;
    squares[b].textContent = temp;

    setTimeout(() => {
        const matches = findMatches();

        if (matches.length > 0) {
            moves--;
            movesDisplay.textContent = moves;
            processMatches();
        } else {
            const temp = squares[a].textContent;
            squares[a].textContent = squares[b].textContent;
            squares[b].textContent = temp;
            busy = false;
            message.textContent = "No match! Try again 😊";
        }
    }, 180);
}

function findMatches() {
    const matched = new Set();

    // Horizontal matches
    for (let row = 0; row < width; row++) {
        let count = 1;

        for (let col = 1; col <= width; col++) {
            const current = row * width + col;
            const previous = row * width + col - 1;

            if (
                col < width &&
                squares[current].textContent === squares[previous].textContent
            ) {
                count++;
            } else {
                if (count >= 3) {
                    for (let k = 0; k < count; k++) {
                        matched.add(row * width + col - 1 - k);
                    }
                }
                count = 1;
            }
        }
    }

    // Vertical matches
    for (let col = 0; col < width; col++) {
        let count = 1;

        for (let row = 1; row <= width; row++) {
            const current = row * width + col;
            const previous = (row - 1) * width + col;

            if (
                row < width &&
                squares[current].textContent === squares[previous].textContent
            ) {
                count++;
            } else {
                if (count >= 3) {
                    for (let k = 0; k < count; k++) {
                        matched.add((row - 1 - k) * width + col);
                    }
                }
                count = 1;
            }
        }
    }

    return [...matched];
}

function clearMatches(initial = false) {
    let matches = findMatches();

    while (matches.length > 0) {
        matches.forEach(index => {
            squares[index].textContent = randomCandy();
        });
        matches = findMatches();
    }
}

function processMatches() {
    const matches = findMatches();

    if (matches.length === 0) {
        busy = false;
        return;
    }

    matches.forEach(index => {
        squares[index].textContent = "";
    });

    score += matches.length * 10;
    scoreDisplay.textContent = score;
    message.textContent = "Sweet! +" + matches.length * 10 + " points 🍭";

    setTimeout(() => {
        dropCandies();
    }, 180);
}

function dropCandies() {
    for (let col = 0; col < width; col++) {
        let candiesAbove = [];

        for (let row = width - 1; row >= 0; row--) {
            const index = row * width + col;

            if (squares[index].textContent !== "") {
                candiesAbove.push(squares[index].textContent);
            }
        }

        for (let row = width - 1; row >= 0; row--) {
            const index = row * width + col;
            squares[index].textContent =
                candiesAbove[width - 1 - row] || randomCandy();
        }
    }

    setTimeout(() => {
        const matches = findMatches();

        if (matches.length > 0) {
            processMatches();
        } else {
            busy = false;

            if (moves <= 0) {
                playing = false;
                message.textContent = "🎉 Game Over! Final Score: " + score;
            }
        }
    }, 200);
}
</script>

</body>

</html>
